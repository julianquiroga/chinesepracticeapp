<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="长城汉语">
<meta name="theme-color" content="#1a0a00">
<link rel="manifest" href="./manifest.json">
<title>长城汉语 · Flashcards</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; }
</style>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.8/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<!-- data.js: tarjetas y colores. Es el ÚNICO archivo que se reemplaza al agregar unidades nuevas. -->
<script src="data.js"></script>

<!-- hanzi-writer: práctica de trazos, empaquetado localmente (no CDN) -->
<script src="hanzi-writer.min.js"></script>
<script src="strokes-data.js"></script>
<script src="char-pinyin.js"></script>

<!-- app.js: la interfaz y la lógica. Casi nunca cambia. -->
<script type="text/babel" data-presets="react" src="app.js"></script>

<script type="text/babel" data-presets="react">
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>

<!-- Soporte offline: cachea la app para practicar sin conexión tras la primera carga -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
